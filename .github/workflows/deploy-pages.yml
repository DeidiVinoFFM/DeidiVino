name: DeidiVino auf GitHub Pages veröffentlichen

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Statische Website bauen
        run: npm run build

      - name: GitHub-Pages-Paket vorbereiten
        shell: bash
        run: |
          mkdir -p _site
          if [ -d out ]; then
            cp -a out/. _site/
          elif [ -d dist/client ]; then
            cp -a dist/client/. _site/
          else
            echo "Kein statisches Ausgabe-Verzeichnis gefunden."
            exit 1
          fi
          touch _site/.nojekyll

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
